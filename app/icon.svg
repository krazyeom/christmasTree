<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4" />
      <stop offset="100%" stop-color="#E09F3E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="64" height="64" rx="16" fill="#061210" stroke="#1f3b30" stroke-width="1.5" />

  <!-- 나무 줄기 -->
  <rect x="28.5" y="50" width="7" height="7" rx="1.5" fill="#8d5b36" />

  <!-- 크리스마스 트리 (하단 레이어) -->
  <polygon points="32,35 12,51 52,51" fill="#047857" />
  <!-- 크리스마스 트리 (중간 레이어) -->
  <polygon points="32,25 17,40 47,40" fill="#059669" />
  <!-- 크리스마스 트리 (상단 레이어) -->
  <polygon points="32,16 22,29 42,29" fill="url(#treeGrad)" />

  <!-- 장식 오너먼트 (반짝이는 볼) -->
  <circle cx="27" cy="25" r="2" fill="#ff6584" filter="url(#glow)" />
  <circle cx="37" cy="34" r="2.2" fill="#ffd166" filter="url(#glow)" />
  <circle cx="23" cy="45" r="2.2" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="34" cy="44" r="2" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="43" cy="46" r="2.2" fill="#ffd166" filter="url(#glow)" />

  <!-- 꼭대기 빛나는 별 -->
  <polygon points="32,7 34.5,13 41,13 36,17 38,23 32,19 26,23 28,17 23,13 29.5,13" fill="url(#starGrad)" filter="url(#glow)" />

  <!-- 작은 눈꽃/반짝임 -->
  <circle cx="15" cy="17" r="1.2" fill="#e2f5ee" opacity="0.75" />
  <circle cx="49" cy="19" r="1.2" fill="#e2f5ee" opacity="0.75" />
  <circle cx="11" cy="35" r="0.9" fill="#e2f5ee" opacity="0.6" />
  <circle cx="53" cy="37" r="0.9" fill="#e2f5ee" opacity="0.6" />
</svg>
